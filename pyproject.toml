[project]
name = "studeCase"
version = "0.1.0"
description = "StudeCase Flet App"
requires-python = ">=3.10"
dependencies = [
    "flet",
    "sqlalchemy",
]

[tool.flet]
org = "com.gnilitskii"
product = "StudeCase"

[tool.flet.app]
path = "app"
module = "mobile"

[tool.flet.android]
extract_packages = ["app"]
